name: Mise à jour liberty-fr.json

on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Téléchargement + français
        run: |
          curl -fsSL https://tiles.openfreemap.org/styles/liberty -o /tmp/liberty.json
          python3 - <<'PY'
          import json, re, sys
          pattern = r'\[\s*"coalesce"(?:\s*,\s*\[\s*"get"\s*,\s*"(?:name|name_en|name:en|name:latin|name:fr)"\s*\])+\s*\]'
          french = '["coalesce",["get","name:fr"],["get","name"]]'
          text = open("/tmp/liberty.json", encoding="utf-8").read()
          text, count = re.subn(pattern, french, text)
          if count == 0:
              sys.exit("Aucun libellé trouvé : le format du style a peut-être changé.")
          json.loads(text)
          open("/tmp/liberty-fr.json", "w", encoding="utf-8").write(text)
          print(f"{count} libellés passés en français")
          PY

      - name: Mise en forme
        run: |
          npx -y -p @maplibre/maplibre-gl-style-spec gl-style-format /tmp/liberty-fr.json > /tmp/formatted.json
          test -s /tmp/formatted.json
          mkdir -p ASSETS
          mv /tmp/formatted.json ASSETS/liberty-fr.json

      - name: Enregistrement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ASSETS/liberty-fr.json
          if git diff --cached --quiet; then
            echo "Déjà à jour."
          else
            git commit -m "[Bot] Mise à jour de liberty-fr.json depuis OpenFreeMap"
            git push
          fi
